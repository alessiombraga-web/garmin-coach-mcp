name: Garmin Sync

on:
  schedule:
    - cron: '0 6 * * *' # Esegue ogni giorno alle 06:00 UTC
  workflow_dispatch: # Permette anche l'avvio manuale dalla scheda Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests

      - name: Run Garmin Sync
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: |
          python -m app.sync
